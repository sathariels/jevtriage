name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Installed-wheel CLI smoke (fixture replay only)
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheel/bin/jevtriage" --version
          "$RUNNER_TEMP/wheel/bin/jevtriage" \
            --answers fixtures/replay-single-ready.json \
            --model jev-1.13.0 \
            --title "Fix typo in README"
          "$RUNNER_TEMP/wheel/bin/python" -c "import jevtriage; print(jevtriage.__version__)"
      - name: sdist includes tests/fixtures and pytest collects
        run: |
          python -m venv "$RUNNER_TEMP/sdist"
          "$RUNNER_TEMP/sdist/bin/pip" install dist/*.tar.gz pytest
          mkdir -p "$RUNNER_TEMP/srcdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/srcdist"
          srcdir=$(echo "$RUNNER_TEMP/srcdist"/jevtriage-*)
          test -f "$srcdir/tests/test_cli.py"
          test -f "$srcdir/fixtures/pr-triage.contract.json"
          test -f "$srcdir/fixtures/replay-ready.json"
          test -f "$srcdir/action.yml"
          cd "$srcdir"
          "$RUNNER_TEMP/sdist/bin/pytest"
